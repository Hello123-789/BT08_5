<!DOCTYPE html>
<html lang="vi"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý sản phẩm</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Quản lý sản phẩm</h2>
        <button class="btn btn-primary" onclick="showCreateProductModal()">
            <i class="fas fa-plus me-1"></i> Thêm sản phẩm
        </button>
    </div>

    <!-- SEARCH & PAGE SIZE -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form id="searchForm" class="row g-2 align-items-center" onsubmit="return false;">
                <div class="col-md-6">
                    <input type="text" id="searchKeyword" class="form-control" placeholder="Nhập tên sản phẩm cần tìm...">
                </div>
                <div class="col-md-3">
                    <select id="pageSize" class="form-select" onchange="loadProductPage(0)">
                        <option value="5" selected>5 sản phẩm / trang</option>
                        <option value="10">10 sản phẩm / trang</option>
                        <option value="20">20 sản phẩm / trang</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" onclick="loadProductPage(0)">
                        <i class="fas fa-search me-1"></i> Tìm kiếm
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TABLE -->
    <div class="table-responsive shadow-sm rounded">
        <table class="table table-bordered table-hover align-middle mb-0" id="productTable">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Hình ảnh</th>
                <th>Tên sản phẩm</th>
                <th>Thương hiệu</th>
                <th>Danh mục</th>
                <th>Giá bán</th>
                <th>Số lượng</th>
                <th style="width: 20%; text-align: center;">Thao tác</th>
            </tr>
            </thead>
            <tbody id="productTableBody">
            <!-- Loaded via GraphQL API -->
            </tbody>
        </table>
    </div>

    <!-- EMPTY NOTICE -->
    <div id="emptyNotice" class="alert alert-warning mt-3 d-none">
        Không tìm thấy sản phẩm nào.
    </div>

    <!-- PAGINATION -->
    <nav class="mt-4">
        <ul class="pagination justify-content-center" id="pagination">
            <!-- Pagination loaded via GraphQL -->
        </ul>
    </nav>

    <!-- CREATE PRODUCT MODAL -->
    <div class="modal fade" id="createProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="addProductForm" onsubmit="return false;">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title"><i class="fas fa-box me-2"></i>Thêm Sản Phẩm Mới</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body row g-3">
                        <div class="col-md-6">
                            <label for="add_productName" class="form-label font-weight-bold">Tên Sản Phẩm *</label>
                            <input type="text" class="form-control" id="add_productName" name="productName" required placeholder="Tên sản phẩm">
                        </div>
                        <div class="col-md-6">
                            <label for="add_brand" class="form-label font-weight-bold">Thương Hiệu</label>
                            <input type="text" class="form-control" id="add_brand" name="brand" placeholder="Yonex, Victor, Li-Ning...">
                        </div>
                        <div class="col-md-6">
                            <label for="add_unitPrice" class="form-label font-weight-bold">Giá Bán (VNĐ) *</label>
                            <input type="number" step="0.01" class="form-control" id="add_unitPrice" name="unitPrice" required placeholder="0.00">
                        </div>
                        <div class="col-md-6">
                            <label for="add_quantity" class="form-label font-weight-bold">Số Lượng *</label>
                            <input type="number" class="form-control" id="add_quantity" name="quantity" value="1" required>
                        </div>
                        <div class="col-md-6">
                            <label for="add_categoryId" class="form-label font-weight-bold">Danh Mục</label>
                            <select class="form-select categorySelect" id="add_categoryId" name="categoryId">
                                <option value="">-- Chọn danh mục --</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="add_imageName" class="form-label font-weight-bold">Tên File Ảnh (trong /uploads/products/)</label>
                            <input type="text" class="form-control" id="add_imageName" name="imageName" placeholder="astrox100zz.jpg, 65z3.jpg...">
                        </div>
                        <div class="col-md-12">
                            <label for="add_description" class="form-label font-weight-bold">Mô Tả Sản Phẩm</label>
                            <textarea class="form-control" id="add_description" name="description" rows="3" placeholder="Mô tả ngắn..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Thêm sản phẩm</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- UPDATE PRODUCT MODAL -->
    <div class="modal fade" id="updateProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="updateProductForm" onsubmit="return false;">
                    <div class="modal-header bg-warning text-dark">
                        <h5 class="modal-title"><i class="fas fa-edit me-2"></i>Cập Nhật Sản Phẩm</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body row g-3">
                        <input type="hidden" id="edit_id" name="id">
                        <div class="col-md-6">
                            <label for="edit_productName" class="form-label font-weight-bold">Tên Sản Phẩm *</label>
                            <input type="text" class="form-control" id="edit_productName" name="productName" required>
                        </div>
                        <div class="col-md-6">
                            <label for="edit_brand" class="form-label font-weight-bold">Thương Hiệu</label>
                            <input type="text" class="form-control" id="edit_brand" name="brand">
                        </div>
                        <div class="col-md-6">
                            <label for="edit_unitPrice" class="form-label font-weight-bold">Giá Bán (VNĐ) *</label>
                            <input type="number" step="0.01" class="form-control" id="edit_unitPrice" name="unitPrice" required>
                        </div>
                        <div class="col-md-6">
                            <label for="edit_quantity" class="form-label font-weight-bold">Số Lượng *</label>
                            <input type="number" class="form-control" id="edit_quantity" name="quantity" required>
                        </div>
                        <div class="col-md-6">
                            <label for="edit_categoryId" class="form-label font-weight-bold">Danh Mục</label>
                            <select class="form-select categorySelect" id="edit_categoryId" name="categoryId">
                                <option value="">-- Chọn danh mục --</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="edit_imageName" class="form-label font-weight-bold">Tên File Ảnh Mới</label>
                            <input type="text" class="form-control" id="edit_imageName" name="imageName">
                        </div>
                        <div class="col-md-12">
                            <label for="edit_description" class="form-label font-weight-bold">Mô Tả Sản Phẩm</label>
                            <textarea class="form-control" id="edit_description" name="description" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-warning"><i class="fas fa-sync-alt me-1"></i>Cập nhật</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- GRAPHQL AJAX SCRIPT -->
    <script>
        var currentPage = 0;

        $(document).ready(function() {
            loadCategoriesDropdown();
            loadProductPage(0);

            // Add Product (GraphQL Mutation)
            $('#addProductForm').submit(function(e) {
                e.preventDefault();
                var name = $('#add_productName').val();
                var brand = $('#add_brand').val();
                var price = parseFloat($('#add_unitPrice').val());
                var quantity = parseInt($('#add_quantity').val());
                var categoryId = $('#add_categoryId').val() ? $('#add_categoryId').val() : null;
                var imageName = $('#add_imageName').val();
                var description = $('#add_description').val();

                var graphqlMutation = {
                    query: `
                        mutation CreateProduct($input: ProductInput!) {
                            createProduct(input: $input) {
                                id
                                name
                            }
                        }`,
                    variables: {
                        input: {
                            name: name,
                            brand: brand,
                            price: price,
                            quantity: quantity,
                            categoryId: categoryId,
                            imageName: imageName,
                            description: description
                        }
                    }
                };

                $.ajax({
                    url: '/graphql',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(graphqlMutation),
                    success: function(res) {
                        if (res.data && res.data.createProduct) {
                            $('#createProductModal').modal('hide');
                            $('#addProductForm')[0].reset();
                            alert('Thêm sản phẩm thành công!');
                            loadProductPage(currentPage);
                        } else {
                            alert('Thêm sản phẩm thất bại!');
                        }
                    },
                    error: function(err) {
                        alert('Lỗi kết nối GraphQL!');
                    }
                });
            });

            // Update Product (GraphQL Mutation)
            $('#updateProductForm').submit(function(e) {
                e.preventDefault();
                var id = $('#edit_id').val();
                var name = $('#edit_productName').val();
                var brand = $('#edit_brand').val();
                var price = parseFloat($('#edit_unitPrice').val());
                var quantity = parseInt($('#edit_quantity').val());
                var categoryId = $('#edit_categoryId').val() ? $('#edit_categoryId').val() : null;
                var imageName = $('#edit_imageName').val();
                var description = $('#edit_description').val();

                var graphqlMutation = {
                    query: `
                        mutation UpdateProduct($id: ID!, $input: ProductInput!) {
                            updateProduct(id: $id, input: $input) {
                                id
                                name
                            }
                        }`,
                    variables: {
                        id: id,
                        input: {
                            name: name,
                            brand: brand,
                            price: price,
                            quantity: quantity,
                            categoryId: categoryId,
                            imageName: imageName,
                            description: description
                        }
                    }
                };

                $.ajax({
                    url: '/graphql',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(graphqlMutation),
                    success: function(res) {
                        if (res.data && res.data.updateProduct) {
                            $('#updateProductModal').modal('hide');
                            alert('Cập nhật sản phẩm thành công!');
                            loadProductPage(currentPage);
                        } else {
                            alert('Cập nhật thất bại!');
                        }
                    },
                    error: function(err) {
                        alert('Lỗi kết nối GraphQL!');
                    }
                });
            });
        });

        // Load Categories for Dropdown (GraphQL Query)
        function loadCategoriesDropdown() {
            var graphqlQuery = {
                query: `
                    query {
                        categories {
                            categoryId
                            categoryName
                        }
                    }`
            };

            $.ajax({
                url: '/graphql',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(graphqlQuery),
                success: function(res) {
                    if (res.data && res.data.categories) {
                        var select = $('.categorySelect');
                        select.find('option:not(:first)').remove();
                        $.each(res.data.categories, function(i, cat) {
                            select.append('<option value="' + cat.categoryId + '">' + escapeHtml(cat.categoryName) + '</option>');
                        });
                    }
                }
            });
        }

        // Load Products Page (GraphQL Query)
        function loadProductPage(page) {
            currentPage = page;
            var keyword = $('#searchKeyword').val();
            var size = parseInt($('#pageSize').val());

            var graphqlQuery = {
                query: `
                    query GetProductsPage($keyword: String, $page: Int, $size: Int) {
                        productsPage(keyword: $keyword, page: $page, size: $size) {
                            content {
                                id
                                name
                                brand
                                price
                                quantity
                                description
                                category {
                                    categoryId
                                    categoryName
                                }
                                images {
                                    imageUrl
                                }
                            }
                            totalPages
                            totalElements
                            number
                            size
                            first
                            last
                        }
                    }`,
                variables: {
                    keyword: keyword,
                    page: page,
                    size: size
                }
            };

            $.ajax({
                url: '/graphql',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(graphqlQuery),
                success: function(res) {
                    if (res.data && res.data.productsPage) {
                        var pageData = res.data.productsPage;
                        renderProductTable(pageData.content);
                        renderPagination(pageData);
                    }
                },
                error: function(err) {
                    console.error("Lỗi khi tải danh sách sản phẩm GraphQL:", err);
                }
            });
        }

        function renderProductTable(products) {
            var tbody = $('#productTableBody');
            tbody.empty();

            if (!products || products.length === 0) {
                $('#emptyNotice').removeClass('d-none');
                return;
            } else {
                $('#emptyNotice').addClass('d-none');
            }

            $.each(products, function(i, p) {
                var imgUrl = (p.images && p.images.length > 0) ? p.images[0].imageUrl : '';
                var imgHtml = imgUrl ?
                    '<img src="/uploads/products/' + imgUrl + '" style="width: 60px; height: 60px; object-fit: cover; border-radius: 6px;" onerror="this.onerror=null; this.src=\'/uploads/' + imgUrl + '\';">' :
                    '<span class="text-muted"><i class="fas fa-image fa-2x"></i></span>';

                var categoryName = p.category ? escapeHtml(p.category.categoryName) : '<span class="text-muted">Chưa phân loại</span>';
                var priceFormatted = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p.price || 0);

                var tr = '<tr>' +
                    '<td>' + p.id + '</td>' +
                    '<td>' + imgHtml + '</td>' +
                    '<td class="fw-bold">' + escapeHtml(p.name) + '</td>' +
                    '<td>' + escapeHtml(p.brand || '-') + '</td>' +
                    '<td>' + categoryName + '</td>' +
                    '<td><span class="badge bg-success font-size-14">' + priceFormatted + '</span></td>' +
                    '<td>' + p.quantity + '</td>' +
                    '<td class="text-center">' +
                    '  <button class="btn btn-outline-warning btn-sm me-2" onclick="showEditProductModal(' + p.id + ')"><i class="fas fa-edit me-1"></i>Sửa</button>' +
                    '  <button class="btn btn-outline-danger btn-sm" onclick="deleteProduct(' + p.id + ')"><i class="fas fa-trash me-1"></i>Xóa</button>' +
                    '</td>' +
                    '</tr>';
                tbody.append(tr);
            });
        }

        function renderPagination(data) {
            var pagination = $('#pagination');
            pagination.empty();

            if (data.totalPages <= 1) return;

            var prevClass = data.first ? 'disabled' : '';
            pagination.append('<li class="page-item ' + prevClass + '"><a class="page-link" href="#" onclick="loadProductPage(' + (data.number - 1) + '); return false;">Trước</a></li>');

            for (var i = 0; i < data.totalPages; i++) {
                var activeClass = (i === data.number) ? 'active' : '';
                pagination.append('<li class="page-item ' + activeClass + '"><a class="page-link" href="#" onclick="loadProductPage(' + i + '); return false;">' + (i + 1) + '</a></li>');
            }

            var nextClass = data.last ? 'disabled' : '';
            pagination.append('<li class="page-item ' + nextClass + '"><a class="page-link" href="#" onclick="loadProductPage(' + (data.number + 1) + '); return false;">Sau</a></li>');
        }

        function showCreateProductModal() {
            $('#addProductForm')[0].reset();
            $('#createProductModal').modal('show');
        }

        function showEditProductModal(id) {
            var graphqlQuery = {
                query: `
                    query GetProductById($id: ID!) {
                        productById(id: $id) {
                            id
                            name
                            brand
                            price
                            quantity
                            description
                            category {
                                categoryId
                            }
                            images {
                                imageUrl
                            }
                        }
                    }`,
                variables: {
                    id: id
                }
            };

            $.ajax({
                url: '/graphql',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(graphqlQuery),
                success: function(res) {
                    if (res.data && res.data.productById) {
                        var p = res.data.productById;
                        $('#edit_id').val(p.id);
                        $('#edit_productName').val(p.name);
                        $('#edit_brand').val(p.brand);
                        $('#edit_unitPrice').val(p.price);
                        $('#edit_quantity').val(p.quantity);
                        $('#edit_description').val(p.description);
                        if (p.category) {
                            $('#edit_categoryId').val(p.category.categoryId);
                        } else {
                            $('#edit_categoryId').val('');
                        }
                        var imgUrl = (p.images && p.images.length > 0) ? p.images[0].imageUrl : '';
                        $('#edit_imageName').val(imgUrl);
                        $('#updateProductModal').modal('show');
                    }
                }
            });
        }

        // Delete Product (GraphQL Mutation)
        function deleteProduct(id) {
            if (confirm("Bạn có chắc chắn muốn xóa sản phẩm này không?")) {
                var graphqlMutation = {
                    query: `
                        mutation DeleteProduct($id: ID!) {
                            deleteProduct(id: $id)
                        }`,
                    variables: {
                        id: id
                    }
                };

                $.ajax({
                    url: '/graphql',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(graphqlMutation),
                    success: function(res) {
                        if (res.data && res.data.deleteProduct) {
                            alert('Xóa sản phẩm thành công!');
                            loadProductPage(currentPage);
                        } else {
                            alert('Xóa sản phẩm thất bại!');
                        }
                    },
                    error: function(err) {
                        alert('Lỗi kết nối GraphQL!');
                    }
                });
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</section>
</body>
</html>
