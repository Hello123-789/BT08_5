<!DOCTYPE html>
<html lang="vi"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý danh mục (GraphQL API)</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Quản lý danh mục (GraphQL)</h2>
        <button class="btn btn-success" onclick="showCreateCategoryModal()">
            <i class="fas fa-plus me-1"></i> Thêm danh mục
        </button>
    </div>

    <!-- SEARCH & PAGE SIZE -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form id="searchForm" class="row g-2 align-items-center" onsubmit="return false;">
                <div class="col-md-6">
                    <input type="text" id="searchKeyword" class="form-control" placeholder="Nhập tên danh mục cần tìm...">
                </div>
                <div class="col-md-3">
                    <select id="pageSize" class="form-select" onchange="loadCategoryPage(0)">
                        <option value="5" selected>5 danh mục / trang</option>
                        <option value="10">10 danh mục / trang</option>
                        <option value="20">20 danh mục / trang</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" onclick="loadCategoryPage(0)">
                        <i class="fas fa-search me-1"></i> Tìm kiếm
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TABLE -->
    <div class="table-responsive shadow-sm rounded">
        <table class="table table-striped table-hover align-middle mb-0" id="categoryTable">
            <thead class="table-dark">
            <tr>
                <th style="width: 10%;">ID</th>
                <th style="width: 20%;">Icon</th>
                <th style="width: 45%;">Tên danh mục</th>
                <th style="width: 25%; text-align: center;">Thao tác</th>
            </tr>
            </thead>
            <tbody id="categoryTableBody">
            <!-- Loaded via GraphQL API -->
            </tbody>
        </table>
    </div>

    <!-- EMPTY NOTICE -->
    <div id="emptyNotice" class="alert alert-warning mt-3 d-none">
        Không tìm thấy danh mục nào.
    </div>

    <!-- PAGINATION -->
    <nav class="mt-4">
        <ul class="pagination justify-content-center" id="pagination">
            <!-- Pagination loaded via GraphQL -->
        </ul>
    </nav>

    <!-- CREATE CATEGORY MODAL -->
    <div class="modal fade" id="createCategoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="addCategoryForm" onsubmit="return false;">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title"><i class="fas fa-folder-plus me-2"></i>Thêm Danh Mục Mới</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="new_categoryName" class="form-label font-weight-bold">Tên Danh Mục</label>
                            <input type="text" class="form-control" id="new_categoryName" name="categoryName" required placeholder="Nhập tên danh mục">
                        </div>
                        <div class="mb-3">
                            <label for="new_icon" class="form-label font-weight-bold">Tên File Icon (trong /uploads/categories/)</label>
                            <input type="text" class="form-control" id="new_icon" name="icon" placeholder="Vợt_cầu_lông.png, giay_cau_long.jpg...">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i>Thêm mới</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- UPDATE CATEGORY MODAL -->
    <div class="modal fade" id="updateCategoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="updateCategoryForm" onsubmit="return false;">
                    <div class="modal-header bg-warning text-dark">
                        <h5 class="modal-title"><i class="fas fa-edit me-2"></i>Cập Nhật Danh Mục</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="edit_categoryId" name="categoryId">
                        <div class="mb-3">
                            <label for="edit_categoryName" class="form-label font-weight-bold">Tên Danh Mục</label>
                            <input type="text" class="form-control" id="edit_categoryName" name="categoryName" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit_icon" class="form-label font-weight-bold">Tên File Icon</label>
                            <input type="text" class="form-control" id="edit_icon" name="icon">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-warning"><i class="fas fa-sync-alt me-1"></i>Cập nhật</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- GRAPHQL AJAX SCRIPT -->
    <script>
        var currentPage = 0;

        $(document).ready(function() {
            loadCategoryPage(0);

            // Add Category (GraphQL Mutation)
            $('#addCategoryForm').submit(function(e) {
                e.preventDefault();
                var name = $('#new_categoryName').val();
                var icon = $('#new_icon').val();

                var graphqlMutation = {
                    query: `
                        mutation CreateCategory($input: CategoryInput!) {
                            createCategory(input: $input) {
                                categoryId
                                categoryName
                                icon
                            }
                        }`,
                    variables: {
                        input: {
                            categoryName: name,
                            icon: icon
                        }
                    }
                };

                $.ajax({
                    url: '/graphql',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(graphqlMutation),
                    success: function(res) {
                        if (res.data && res.data.createCategory) {
                            $('#createCategoryModal').modal('hide');
                            $('#addCategoryForm')[0].reset();
                            alert('Thêm danh mục thành công!');
                            loadCategoryPage(currentPage);
                        } else {
                            alert('Thêm danh mục thất bại!');
                        }
                    },
                    error: function(xhr) {
                        alert('Lỗi kết nối GraphQL!');
                    }
                });
            });

            // Update Category (GraphQL Mutation)
            $('#updateCategoryForm').submit(function(e) {
                e.preventDefault();
                var id = $('#edit_categoryId').val();
                var name = $('#edit_categoryName').val();
                var icon = $('#edit_icon').val();

                var graphqlMutation = {
                    query: `
                        mutation UpdateCategory($id: ID!, $input: CategoryInput!) {
                            updateCategory(id: $id, input: $input) {
                                categoryId
                                categoryName
                                icon
                            }
                        }`,
                    variables: {
                        id: id,
                        input: {
                            categoryName: name,
                            icon: icon
                        }
                    }
                };

                $.ajax({
                    url: '/graphql',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(graphqlMutation),
                    success: function(res) {
                        if (res.data && res.data.updateCategory) {
                            $('#updateCategoryModal').modal('hide');
                            alert('Cập nhật danh mục thành công!');
                            loadCategoryPage(currentPage);
                        } else {
                            alert('Cập nhật thất bại!');
                        }
                    },
                    error: function(xhr) {
                        alert('Lỗi kết nối GraphQL!');
                    }
                });
            });
        });

        // Load Categories Page (GraphQL Query)
        function loadCategoryPage(page) {
            currentPage = page;
            var keyword = $('#searchKeyword').val();
            var size = parseInt($('#pageSize').val());

            var graphqlQuery = {
                query: `
                    query GetCategoriesPage($keyword: String, $page: Int, $size: Int) {
                        categoriesPage(keyword: $keyword, page: $page, size: $size) {
                            content {
                                categoryId
                                categoryName
                                icon
                            }
                            totalPages
                            totalElements
                            number
                            size
                            first
                            last
                        }
                    }`,
                variables: {
                    keyword: keyword,
                    page: page,
                    size: size
                }
            };

            $.ajax({
                url: '/graphql',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(graphqlQuery),
                success: function(res) {
                    if (res.data && res.data.categoriesPage) {
                        var pageData = res.data.categoriesPage;
                        renderCategoryTable(pageData.content);
                        renderPagination(pageData);
                    }
                },
                error: function(err) {
                    console.error("Lỗi tải danh mục GraphQL:", err);
                }
            });
        }

        function renderCategoryTable(categories) {
            var tbody = $('#categoryTableBody');
            tbody.empty();

            if (!categories || categories.length === 0) {
                $('#emptyNotice').removeClass('d-none');
                return;
            } else {
                $('#emptyNotice').addClass('d-none');
            }

            $.each(categories, function(i, cat) {
                var iconHtml = cat.icon ?
                    '<img src="/uploads/categories/' + cat.icon + '" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px;" alt="icon" onerror="this.onerror=null; this.src=\'/uploads/' + cat.icon + '\';">' :
                    '<span class="text-muted"><i class="fas fa-folder fa-2x"></i></span>';

                var tr = '<tr>' +
                    '<td>' + cat.categoryId + '</td>' +
                    '<td>' + iconHtml + '</td>' +
                    '<td class="fw-bold">' + escapeHtml(cat.categoryName) + '</td>' +
                    '<td class="text-center">' +
                    '  <button class="btn btn-outline-warning btn-sm me-2" onclick="showEditModal(' + cat.categoryId + ', \'' + escapeHtml(cat.categoryName) + '\', \'' + (cat.icon || '') + '\')"><i class="fas fa-edit me-1"></i>Sửa</button>' +
                    '  <button class="btn btn-outline-danger btn-sm" onclick="deleteCategory(' + cat.categoryId + ')"><i class="fas fa-trash me-1"></i>Xóa</button>' +
                    '</td>' +
                    '</tr>';
                tbody.append(tr);
            });
        }

        function renderPagination(data) {
            var pagination = $('#pagination');
            pagination.empty();

            if (data.totalPages <= 1) return;

            var prevClass = data.first ? 'disabled' : '';
            pagination.append('<li class="page-item ' + prevClass + '"><a class="page-link" href="#" onclick="loadCategoryPage(' + (data.number - 1) + '); return false;">Trước</a></li>');

            for (var i = 0; i < data.totalPages; i++) {
                var activeClass = (i === data.number) ? 'active' : '';
                pagination.append('<li class="page-item ' + activeClass + '"><a class="page-link" href="#" onclick="loadCategoryPage(' + i + '); return false;">' + (i + 1) + '</a></li>');
            }

            var nextClass = data.last ? 'disabled' : '';
            pagination.append('<li class="page-item ' + nextClass + '"><a class="page-link" href="#" onclick="loadCategoryPage(' + (data.number + 1) + '); return false;">Sau</a></li>');
        }

        function showCreateCategoryModal() {
            $('#addCategoryForm')[0].reset();
            $('#createCategoryModal').modal('show');
        }

        function showEditModal(id, name, icon) {
            $('#edit_categoryId').val(id);
            $('#edit_categoryName').val(name);
            $('#edit_icon').val(icon);
            $('#updateCategoryModal').modal('show');
        }

        // Delete Category (GraphQL Mutation)
        function deleteCategory(id) {
            if (confirm("Bạn có chắc chắn muốn xóa danh mục này không?")) {
                var graphqlMutation = {
                    query: `
                        mutation DeleteCategory($id: ID!) {
                            deleteCategory(id: $id)
                        }`,
                    variables: {
                        id: id
                    }
                };

                $.ajax({
                    url: '/graphql',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(graphqlMutation),
                    success: function(res) {
                        if (res.data && res.data.deleteCategory) {
                            alert('Xóa danh mục thành công!');
                            loadCategoryPage(currentPage);
                        } else {
                            alert('Xóa danh mục thất bại!');
                        }
                    },
                    error: function(err) {
                        alert('Lỗi kết nối GraphQL!');
                    }
                });
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</section>
</body>
</html>
