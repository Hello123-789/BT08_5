<!DOCTYPE html>
<html lang="vi"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Trang chủ - Cửa hàng cầu lông</title>
</head>
<body>
<section layout:fragment="content">
    <!-- HERO BANNER -->
    <div class="bg-primary text-white p-4 rounded-3 mb-4 shadow-sm">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="display-6 fw-bold mb-2"><i class="fas fa-store me-2"></i>Badminton Shop - GraphQL API</h1>
                <p class="lead mb-0">Hệ thống quản lý và hiển thị sản phẩm cầu lông tối ưu với công nghệ Spring Boot GraphQL &amp; AJAX.</p>
            </div>
            <div class="col-md-4 text-end d-none d-md-block">
                <i class="fas fa-shuttlecock fa-5x opacity-75"></i>
            </div>
        </div>
    </div>

    <!-- CATEGORY FILTER BUTTONS -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                <h5 class="mb-0 fw-bold"><i class="fas fa-filter me-2 text-primary"></i>Lọc sản phẩm theo danh mục:</h5>
                <div id="categoryFilterContainer" class="d-flex flex-wrap gap-2">
                    <button class="btn btn-primary active category-filter-btn" data-cat-id="all" onclick="loadProductsSortedByPrice()">
                        <i class="fas fa-layer-group me-1"></i> Tất cả (Giá tăng dần)
                    </button>
                    <!-- Category filter pills loaded via GraphQL -->
                </div>
            </div>
        </div>
    </div>

    <!-- SECTION TITLE -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 id="gridTitle" class="fw-bold text-dark mb-0">
            <i class="fas fa-sort-amount-down-alt text-success me-2"></i>Sản phẩm sắp xếp theo giá từ thấp đến cao
        </h4>
        <span id="productCountBadge" class="badge bg-secondary font-size-14 fs-6">Đang tải...</span>
    </div>

    <!-- PRODUCT GRID -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="productGrid">
        <!-- Products rendered via GraphQL AJAX -->
    </div>

    <!-- EMPTY NOTICE -->
    <div id="emptyGridNotice" class="alert alert-warning mt-4 text-center d-none shadow-sm">
        <i class="fas fa-exclamation-triangle fa-2x mb-2 d-block"></i>
        Không tìm thấy sản phẩm nào trong danh mục này.
    </div>

    <!-- GRAPHQL JAVASCRIPT AJAX -->
    <script>
        $(document).ready(function() {
            loadCategoryFilterPills();
            loadProductsSortedByPrice();
        });

        // 1. Tải các nút Danh mục bằng GraphQL Query
        function loadCategoryFilterPills() {
            var graphqlQuery = {
                query: `
                    query {
                        categories {
                            categoryId
                            categoryName
                            icon
                        }
                    }
                `
            };

            $.ajax({
                url: '/graphql',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(graphqlQuery),
                success: function(res) {
                    if (res.data && res.data.categories) {
                        renderCategoryPills(res.data.categories);
                    }
                }
            });
        }

        function renderCategoryPills(categories) {
            var container = $('#categoryFilterContainer');
            $.each(categories, function(i, cat) {
                var btn = $('<button class="btn btn-outline-primary category-filter-btn" data-cat-id="' + cat.categoryId + '">' +
                    '<i class="fas fa-tag me-1"></i>' + cat.categoryName + '</button>');

                btn.click(function() {
                    $('.category-filter-btn').removeClass('active btn-primary').addClass('btn-outline-primary');
                    $(this).removeClass('btn-outline-primary').addClass('active btn-primary');
                    loadProductsByCategory(cat.categoryId, cat.categoryName);
                });

                container.append(btn);
            });
        }

        // 2. Chức năng 1: Hiển thị tất cả product sắp xếp giá từ thấp đến cao
        function loadProductsSortedByPrice() {
            $('.category-filter-btn').removeClass('active btn-primary').addClass('btn-outline-primary');
            $('[data-cat-id="all"]').removeClass('btn-outline-primary').addClass('active btn-primary');
            $('#gridTitle').html('<i class="fas fa-sort-amount-down-alt text-success me-2"></i>Sản phẩm sắp xếp theo giá từ thấp đến cao');

            var graphqlQuery = {
                query: `
                    query {
                        productsSortedByPriceAsc {
                            id
                            name
                            brand
                            price
                            quantity
                            description
                            category {
                                categoryId
                                categoryName
                            }
                            images {
                                imageUrl
                            }
                        }
                    }
                `
            };

            $.ajax({
                url: '/graphql',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(graphqlQuery),
                success: function(res) {
                    if (res.data && res.data.productsSortedByPriceAsc) {
                        renderProductGrid(res.data.productsSortedByPriceAsc);
                    }
                },
                error: function(err) {
                    console.error("Lỗi khi tải sản phẩm GraphQL:", err);
                }
            });
        }

        // 3. Chức năng 2: Lấy tất cả product của 01 category hiển thị trong trang home
        function loadProductsByCategory(categoryId, categoryName) {
            $('#gridTitle').html('<i class="fas fa-folder-open text-primary me-2"></i>Danh mục: ' + escapeHtml(categoryName));

            var graphqlQuery = {
                query: `
                    query GetProductsByCategory($catId: ID!) {
                        productsByCategory(categoryId: $catId) {
                            id
                            name
                            brand
                            price
                            quantity
                            description
                            category {
                                categoryId
                                categoryName
                            }
                            images {
                                imageUrl
                            }
                        }
                    }`,
                variables: {
                    catId: categoryId
                }
            };

            $.ajax({
                url: '/graphql',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(graphqlQuery),
                success: function(res) {
                    if (res.data && res.data.productsByCategory) {
                        renderProductGrid(res.data.productsByCategory);
                    }
                },
                error: function(err) {
                    console.error("Lỗi khi lọc sản phẩm theo category GraphQL:", err);
                }
            });
        }

        // 4. Render Grid Thẻ Sản Phẩm
        function renderProductGrid(products) {
            var grid = $('#productGrid');
            grid.empty();

            $('#productCountBadge').text(products.length + ' sản phẩm');

            if (!products || products.length === 0) {
                $('#emptyGridNotice').removeClass('d-none');
                return;
            } else {
                $('#emptyGridNotice').addClass('d-none');
            }

            $.each(products, function(i, p) {
                var imgUrl = (p.images && p.images.length > 0) ? p.images[0].imageUrl : '';
                var imgSrc = imgUrl ? '/uploads/products/' + imgUrl : '/uploads/no_image.png';

                var categoryBadge = p.category ?
                    '<span class="badge bg-info text-dark mb-2">' + escapeHtml(p.category.categoryName) + '</span>' :
                    '<span class="badge bg-secondary mb-2">Chưa phân loại</span>';

                var priceFormatted = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p.price || 0);

                var cardHtml = `
                    <div class="col">
                        <div class="card h-100 shadow-sm hover-shadow transition">
                            <div class="position-relative overflow-hidden text-center bg-light p-3" style="height: 200px;">
                                <img src="${imgSrc}" class="card-img-top mh-100 mw-100 w-auto h-auto object-fit-contain" alt="${escapeHtml(p.name)}" onerror="this.onerror=null; this.src='/uploads/${imgUrl}';">
                            </div>
                            <div class="card-body d-flex flex-column">
                                <div class="mb-1">${categoryBadge}</div>
                                <h6 class="card-title fw-bold text-truncate mb-1" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</h6>
                                <p class="card-text text-muted small mb-2">${escapeHtml(p.brand || 'Thương hiệu khác')}</p>
                                <p class="card-text text-secondary small text-truncate-2 flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${escapeHtml(p.description || '')}</p>
                                <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                                    <span class="fs-6 fw-bold text-success">${priceFormatted}</span>
                                    <span class="badge bg-light text-dark border">Kho: ${p.quantity}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.append(cardHtml);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</section>
</body>
</html>
